# Steps executed when a case is created. Edit this file to adjust the workflow.
#
# Equivalent manual operations:
#   cd ~/CFD_cloud_NFS/Straight        (folder depends on simulation_type)
#   cp -r template_CFD CASE_002
#   cd CASE_002
#   mv template.sim CASE_002.sim
#   (copy the uploaded geometry into the case folder)
#   (write case_parameter.dat)
#   starccm+ -np 31 -batch batch_run.java CASE_002.sim
#
# Available variables (expanded at runtime):
#   {{nfs_root}} {{sim_type_folder}} {{template_folder_name}} {{case_name}}
#   {{case_folder}} {{template_sim_filename}} {{uploaded_filename}}
#   {{starccm_path}} {{cores}} {{entry_macro}}

steps:
  - action: copy_folder
    source: "{{nfs_root}}/{{sim_type_folder}}/{{template_folder_name}}"
    dest: "{{nfs_root}}/{{sim_type_folder}}/{{case_name}}"

  - action: rename_file
    source: "{{case_folder}}/{{template_sim_filename}}"
    dest: "{{case_folder}}/{{case_name}}.sim"

  - action: save_uploaded_file
    dest: "{{case_folder}}/{{uploaded_filename}}"

  - action: write_case_parameter
    dest: "{{case_folder}}/case_parameter.dat"

  - action: run_command
    command: "{{starccm_path}} -np {{cores}} -batch {{entry_macro}} {{case_name}}.sim"
    cwd: "{{case_folder}}"
    log_to: "{{case_folder}}/workflow.log"
    pid_to: "{{case_folder}}/run.pid"
